<text x="1200" y="837" text-anchor="middle" fill="#5FD38D" font-size="20" font-weight="700">AFTER: 0/40 steered RCAs   |   0/40 clickable attacker links</text>
<text x="800" y="882" text-anchor="middle" fill="#A9B4C7" font-size="15" font-weight="400">Amazon Nova Pro, 40 live runs per condition. Honest incidents: 30/30 correct before and after.</text>
