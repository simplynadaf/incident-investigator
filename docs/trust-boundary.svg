<text x="1240" y="484" text-anchor="middle" fill="#FF4D4D" font-size="13" font-weight="700">attacker path cut</text>
<rect x="1050" y="680" width="300" height="44" rx="8" fill="#232F47" stroke="#5FD38D" stroke-width="3"/><text x="1200.0" y="697.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="700">GitHub issue</text><text x="1200.0" y="716.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="400">RCA + labelled log line</text>
<path d="M1200,724 L1200,742" fill="none" stroke="#5FD38D" stroke-width="2.5"  marker-end="url(#ar)"/>
<rect x="1050" y="742" width="300" height="42" rx="8" fill="#232F47" stroke="#5FD38D" stroke-width="3"/><text x="1200.0" y="758.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="700">on-call human</text><text x="1200.0" y="777.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="400">reads data, not instructions</text>
<rect x="20" y="804" width="760" height="52" rx="10" fill="#161E2D" stroke="#FF4D4D" stroke-width="2"/>
<text x="400" y="837" text-anchor="middle" fill="#FF4D4D" font-size="20" font-weight="700">BEFORE: 12/40 steered RCAs   |   30/40 clickable attacker links</text>
