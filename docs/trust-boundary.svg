<text x="210" y="354" text-anchor="end" fill="#FF4D4D" font-size="13" font-weight="400">raw error_log</text>
<rect x="60" y="390" width="300" height="60" rx="8" fill="#232F47" stroke="#FF4D4D" stroke-width="2"/><text x="210.0" y="415.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="700">Amazon Nova Pro prompt</text><text x="210.0" y="434.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="400">contains error_log</text>
<rect x="440" y="390" width="300" height="60" rx="8" fill="#232F47" stroke="#FF4D4D" stroke-width="2"/><text x="590.0" y="415.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="700">GitHub issue body</text><text x="590.0" y="434.4" text-anchor="middle" fill="#F2F4F8" font-size="14" font-weight="400">error_log pasted verbatim</text>
